name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # Install runtime + dev deps; demucs/torch are skipped because
          # the CI image does not have CUDA and the package-level tests
          # only exercise the numpy helpers.
          pip install -e ".[dev]"
          pip install numpy scipy librosa soundfile pretty_midi matplotlib

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -q
