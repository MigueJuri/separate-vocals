[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "separate-vocals"
version = "0.1.0"
description = "Multi-voice vocal separation, pitch tracking and per-voice audio splitting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Miguel Juri" }]
keywords = ["audio", "vocal-separation", "demucs", "pitch-tracking", "music-information-retrieval", "midi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pretty_midi>=0.2.9",
    "matplotlib>=3.7",
    "demucs>=4.0.10",
    "torch>=2.0",
    "torchaudio>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
diarization = [
    "pyannote-audio>=3.1",
    "speechbrain>=1.0",
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.7",
]

[project.scripts]
separate-vocals = "separatevocals.vocal_notes:main"

[project.urls]
Repository = "https://github.com/MigueJuri/separate-vocals"
Issues = "https://github.com/MigueJuri/separate-vocals/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
